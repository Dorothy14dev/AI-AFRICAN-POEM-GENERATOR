<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <link rel="stylesheet" href="src/styles.css" />
    <title>AI Poem Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI African Poem Generator</h1>
      </header>

      <main>
        <form id="poem-generator-form">
          <input
            id="poem-topic"
            type="text"
            placeholder="Enter the topic of the African poem"
            autofocus
            required
            autocomplete="off"
            class="instructions"
          />

          <input type="submit" class="submit-button" />
        </form>

        <div id="poem" class="poems"></div>
      </main>

      <footer>
        <p>
          This AI Project was coded by
          <a href="https://github.com/Dorothy14dev" target="_blank">
            Dorothy Ngosohna Sohna
          </a>
          and is open sourced on
          <a
            href="https://github.com/Dorothy14dev/AI-AFRICAN-POEM-GENERATOR"
            target="_blank"
          >
            GitHub
          </a>
          and is hosted on
          <a
            href="https://ai-africanpoemgenerator.netlify.app/"
            target="_blank"
          >
            Netlify </a
          >.
        </p>
      </footer>
    </div>

    <script src="src/index.js"></script>
  </body>
</html>
